<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game &amp; Story Development — Mickey Farmer</title>
  <meta name="description" content="Games, short stories, and scripts from Mickey Farmer." />
  <link rel="stylesheet" href="css/styles.css" />
</head>

  <header class="site-header">

        <span class="card-desc">Coming soon</span>

      <span class="card-body">
        <span class="card-title">Short Stories &amp; Scripts</span>
        <span class="card-desc">Read them here — nowhere else they're hosted</span>
      </span>

  <footer class="site-footer">
