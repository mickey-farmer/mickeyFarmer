<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Story — Mickey Farmer</title>
  <meta name="description" content="An original short story or script by Mickey Farmer." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/stories.css" />
</head>
<body data-page="story" data-theme="stories">

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site-shell">

    <!-- Sidebar is rendered by js/nav.js from the SITE array in that file. -->
    <div class="site-sidebar" id="siteNav"></div>

    <div class="site-body">

      <main class="site-content story-page" id="main">
        <a class="back-link" href="stories.html">&larr; All stories</a>
        <div id="storyMeta" class="story-meta"></div>
        <article id="storyContent" class="story-content">
          <p>Loading…</p>

      </main>

      <footer class="site-footer">
        <p>&copy; <span id="year"></span> Mickey Farmer</p>
      </footer>

    </div>
  </div>

  <!-- Pinned to a major version on purpose: unpinned "marked" resolves to
       latest, so a future breaking release would silently turn every story into
       the generic "couldn't load" message. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/script.js"></script>

  <script src="js/story.js"></script>
